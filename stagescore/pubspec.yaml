name: stagescore
description: StageScore by Backing & Score — sheet music for the stand
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pdfrx: ^2.4.7
  file_picker: ^11.0.2
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  pdf: ^3.13.0
  share_plus: ^12.0.2
  archive: ^4.0.9
  share_handler: ^0.0.25
  flutter_soloud: ^4.0.13
  audio_session: ^0.2.4
  wakelock_plus: ^1.5.2
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/stagescore-logo.png
  adaptive_icon_background: "#0D8B86"
  adaptive_icon_foreground: assets/brand/stagescore-logo.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0D8B86"
  image: assets/brand/stagescore-logo.png
  android_12:
    color: "#0D8B86"
    image: assets/brand/stagescore-logo.png
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/sample_score.pdf
    - assets/brand/stagescore-logo.png
    - assets/icons/metronome.png
    - assets/icons/draw.png
